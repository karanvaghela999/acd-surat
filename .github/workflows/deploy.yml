name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::047249942995:role/github-actions-acd26-deploy
          aws-region: ap-south-1

      - name: Sync to S3
        run: |
          BUCKET=s3://acd26.awsugsurat.com
          REGION=ap-south-1

          # Next.js hashes _next/static filenames — safe to cache for 1 year
          aws s3 sync ./out/_next/static $BUCKET/_next/static \
            --delete --region $REGION \
            --cache-control "public, max-age=31536000, immutable"

          # Images and fonts — cache for 1 week
          aws s3 sync ./out $BUCKET \
            --delete --region $REGION \
            --exclude "*" \
            --include "*.webp" --include "*.avif" --include "*.png" \
            --include "*.jpg" --include "*.jpeg" --include "*.svg" \
            --include "*.woff2" --include "*.woff" \
            --cache-control "public, max-age=604800"

          # HTML, robots, sitemap — always revalidate
          aws s3 sync ./out $BUCKET \
            --delete --region $REGION \
            --exclude "_next/static/*" \
            --exclude "*.webp" --exclude "*.avif" --exclude "*.png" \
            --exclude "*.jpg" --exclude "*.jpeg" --exclude "*.svg" \
            --exclude "*.woff2" --exclude "*.woff" \
            --cache-control "public, no-cache"

      - name: Apply security headers policy
        run: |
          python3 << 'PYEOF'
          import subprocess, json, sys

          POLICY_NAME  = "acd26-security-headers"
          DIST_ID      = "E2AWA32IPHA0UU"

          with open("cloudfront/security-headers-policy.json") as f:
              policy_cfg = json.load(f)

          # Check whether the named policy already exists
          def run(*cmd):
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"ERROR running: {' '.join(cmd)}", flush=True)
                  print(r.stderr, flush=True)
                  sys.exit(r.returncode)
              return r

          r = run("aws", "cloudfront", "list-response-headers-policies",
                  "--type", "custom", "--region", "us-east-1", "--output", "json")
          items = json.loads(r.stdout).get("ResponseHeadersPolicyList", {}).get("Items", [])
          existing = next(
              (p for p in items
               if p["ResponseHeadersPolicy"]["ResponseHeadersPolicyConfig"]["Name"] == POLICY_NAME),
              None
          )

          if existing:
              policy_id = existing["ResponseHeadersPolicy"]["Id"]
              r = run("aws", "cloudfront", "get-response-headers-policy",
                      "--id", policy_id, "--region", "us-east-1", "--output", "json")
              etag = json.loads(r.stdout)["ETag"]
              run("aws", "cloudfront", "update-response-headers-policy",
                  "--id", policy_id,
                  "--response-headers-policy-config", json.dumps(policy_cfg),
                  "--if-match", etag, "--region", "us-east-1")
              print(f"Updated response headers policy {policy_id}")
          else:
              r = run("aws", "cloudfront", "create-response-headers-policy",
                      "--response-headers-policy-config", json.dumps(policy_cfg),
                      "--region", "us-east-1", "--output", "json")
              policy_id = json.loads(r.stdout)["ResponseHeadersPolicy"]["Id"]
              print(f"Created response headers policy {policy_id}")

          # Attach to distribution if not already set
          r = run("aws", "cloudfront", "get-distribution-config",
                  "--id", DIST_ID, "--output", "json")
          data   = json.loads(r.stdout)
          etag   = data["ETag"]
          config = data["DistributionConfig"]

          if config["DefaultCacheBehavior"].get("ResponseHeadersPolicyId") != policy_id:
              config["DefaultCacheBehavior"]["ResponseHeadersPolicyId"] = policy_id
              run("aws", "cloudfront", "update-distribution",
                  "--id", DIST_ID,
                  "--distribution-config", json.dumps(config),
                  "--if-match", etag)
              print("Distribution updated — security headers policy attached")
          else:
              print("Distribution already uses this policy — no update needed")
          PYEOF

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2AWA32IPHA0UU \
            --paths "/*"
